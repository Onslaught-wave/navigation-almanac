# Publishes the navigational-warnings feed once an hour.
#
#   cd /srv/navigation-almanac
#   printf '%s' 'THE-64-HEX-KEY'  > feed/navwarn.key && chmod 600 feed/navwarn.key
#   printf '%s' 'github_pat_...'  > feed/git.token   && chmod 600 feed/git.token
#   docker compose -f feed/docker-compose.yml up -d --build
#
# Nothing else on the server is configured: no cron entry, no Go toolchain, and
# `restart: unless-stopped` brings the container back after a reboot.
#
# Both secrets are mounted as files rather than passed as environment
# variables, which anything able to inspect the container can read.

services:
  feed:
    build: .
    image: navwarn-feed
    container_name: navwarn-feed
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/Onslaught-wave/navigation-almanac.git
      BRANCH: gh-pages
      INTERVAL: 3600          # 0 makes it a one-shot, for host cron instead
    secrets:
      - navwarn_key           # signs the bundle; must match the key in the app
      - git_token             # pushes the published branch, via ~/.netrc
    volumes:
      # The clone and the "already published" marker, so a restart neither
      # re-clones nor republishes a feed that has not changed.
      - navwarn-data:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

secrets:
  navwarn_key:
    file: ./navwarn.key
  git_token:
    file: ./git.token

volumes:
  navwarn-data:
