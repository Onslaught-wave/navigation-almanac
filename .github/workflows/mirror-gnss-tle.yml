name: Mirror GNSS TLE

# Navigation Almanac fetches its GNSS orbital catalogue from CelesTrak. That
# is one publisher, and it does go down and does rate-limit clients that ask
# too often, which leaves the app's Sky View on a stale snapshot. This job
# keeps a daily copy here so the app has somewhere else to look. A day-old
# set is fine: TLE-predicted look angles drift well under a degree over weeks.

on:
  schedule:
    - cron: "17 4 * * *"      # daily, off the hour to avoid the stampede
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the catalogue from CelesTrak
        id: fetch
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if curl -sS --fail --max-time 60 \
                 "https://celestrak.org/NORAD/elements/gp.php?GROUP=gnss&FORMAT=tle" \
                 -o fresh.tle; then
              echo "fetched on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed" >&2
            sleep 30
          done
          echo "CelesTrak unreachable after 3 attempts; keeping the existing mirror" >&2
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Validate before publishing
        if: steps.fetch.outputs.skip != 'true'
        run: |
          COUNT=$(grep -c "^1 " fresh.tle || true)
          if [ "$COUNT" -lt 100 ]; then
            echo "refusing: only $COUNT TLE entries (truncated or an error page?)" >&2
            exit 1
          fi
          # Every satellite must carry the three lines the parser expects.
          LINES=$(grep -c . fresh.tle)
          if [ $((LINES % 3)) -ne 0 ]; then
            echo "refusing: $LINES non-empty lines is not a whole number of TLE sets" >&2
            exit 1
          fi
          echo "validated $COUNT satellites"

      - name: Publish if changed
        if: steps.fetch.outputs.skip != 'true'
        run: |
          if [ -f gnss.tle ] && cmp -s fresh.tle gnss.tle; then
            echo "unchanged; nothing to publish"
            rm fresh.tle
            exit 0
          fi
          mv fresh.tle gnss.tle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gnss.tle
          git commit -m "chore: refresh GNSS TLE mirror ($(grep -c '^1 ' gnss.tle) satellites)"
          git push
