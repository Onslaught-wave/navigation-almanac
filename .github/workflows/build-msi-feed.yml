name: Build MSI feed

# Navigation Almanac shows navigational warnings (NAVAREA / NAVTEX). No free
# service publishes them worldwide, so `feed/` scrapes each national
# coordinator and bundles the result into one encrypted, compressed blob.
#
# The bundle is never committed. It is ~200 KB of AES-GCM output, so it does
# not delta-compress at all — every hourly publish would be a fresh 200 KB
# object in the repository, forever. Instead the whole site is uploaded as a
# Pages artifact and deployed, which leaves no trace in git history.
#
# That does mean this workflow publishes the *whole* site, so anything
# committed to the repository (index.html, privacy.html, the mirrored TLE set)
# goes live on the next hourly run.
#
# The job is deliberately allowed to publish a partial feed. Coordinators go
# down; a feed missing one area is still useful, and the manifest records which
# sources failed so the app can say "source unavailable" rather than show an
# empty area — which a mariner would read as "nothing in force".
#
# Requires: Settings -> Pages -> Source = "GitHub Actions",
#           and a NAVWARN_KEY repository secret (feed -genkey prints one).

on:
  schedule:
    - cron: "7 * * * *"      # hourly, off the hour to avoid the stampede
  workflow_dispatch:
  push:
    branches: [main]         # so a site edit goes live without waiting an hour

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: feed/go.sum

      - name: Build the feed
        env:
          NAVWARN_KEY: ${{ secrets.NAVWARN_KEY }}
        run: |
          if [ -z "$NAVWARN_KEY" ]; then
            echo "::error::NAVWARN_KEY is not set. Run 'go run ./feed -genkey' and add it"
            echo "under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          cd feed && go build -o /tmp/feed . && /tmp/feed -out "$GITHUB_WORKSPACE/msi"

      - name: Stage the site
        run: |
          mkdir -p _site
          # Everything published, minus the builder's own source and git data.
          rsync -a --exclude '.git' --exclude '.github' --exclude 'feed' \
                --exclude '_site' --exclude '.gitignore' ./ _site/
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("_site/msi/manifest.json"))
          by = {}
          for name, s in m["sources"].items():
              by.setdefault(s["status"], []).append(name)
          print(f'### MSI build {m["build"]}\n')
          print(f'- {m["warnings"]} warnings, {m["with_position"]} with a position')
          print(f'- {m["bytes"] / 1024:.0f} KB blob, generated {m["generated_at"]}')
          for state in ("ok", "stale", "failed", "unavailable"):
              if by.get(state):
                  print(f'- {state}: {", ".join(sorted(by[state]))}')
          # A parser that broke is a regression; an unavailable coordinator is
          # a known limitation. Only the first deserves attention.
          for name in sorted(by.get("failed", [])):
              print(f'::warning::source {name} failed to parse')
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
